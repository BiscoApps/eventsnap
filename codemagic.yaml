workflows:
  ios-release:
    name: EventSnap iOS Release
    max_build_duration: 60
    environment:
      vars:
        VITE_NATIVE_APP: "true"
        VITE_API_BASE_URL: "https://eventsnapapp.live"
        BUNDLE_ID: "com.eventsnapapp.ios"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22.11.0
      xcode: latest
      cocoapods: default
    code_signing:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eventsnapapp.ios
    integrations:
      app_store_connect: Codemagic
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Generate Podfile
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Set up code signing
        script: |
          xcode-project use-profiles --type app-store
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: EventSnap Android Release
    max_build_duration: 60
    environment:
      vars:
        VITE_NATIVE_APP: "true"
        VITE_API_BASE_URL: "https://eventsnapapp.live"
      node: 22.11.0
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build Android release
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
